services:
  - type: web
    name: arnix-hdrezka-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HDREZKA_HOST
        value: https://rezka.ag/
